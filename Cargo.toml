[package]
name = "rtunnel"
version = "0.1.0"
edition = "2024"
description = "Secure local tunnel daemon and client — an ngrok and localtunnel alternative in pure Rust"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/rtunnel"
readme = "README.md"
keywords = ["tunnel", "ngrok", "localtunnel", "proxy", "networking"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "fast-rng", "serde"] }
